[package]
name = "codebridge"
version = "0.0.1"
edition = "2021"
authors = ["Brook.Xi <honkercn@126.com>"]
description = "CodeBridge CLI: remote development and local hardware bridge with Mutagen"

[lib]
name = "codebridge"
path = "src/Common/mod.rs"

[[bin]]
name = "CodeBridgeLocal"
path = "src/Local/main.rs"

[[bin]]
name = "CodeBridgeVPS"
path = "src/VPS/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
once_cell = "1.19"
