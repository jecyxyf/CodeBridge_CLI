<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>软件框架图</title>
  <style>:root {
  color-scheme: dark;
  --canvas: #151c28;
  --panel: #202a39;
  --line: #3c4b60;
  --text: #e8eef5;
  --muted: #a7b6c9;
  --blue: #81b3e9;
  --teal: #6da89a;
  font-family: "Segoe UI","Microsoft YaHei",sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--canvas)
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  overflow: hidden
}
button,input,textarea,select {
  font: inherit;
  color: inherit
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: #273447;
  border-radius: 5px;
  padding: 7px 11px;
  white-space: nowrap
}
button:hover {
  background: #34465e;
  border-color: #6d8aaa
}
button:disabled {
  opacity: .45;
  cursor: not-allowed
}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px
}
button.primary {
  background: #81b3e9;
  color: #142336;
  border-color: #81b3e9;
  font-weight: 600
}
button.danger-text {
  color: #efaaaa
}
input,textarea,select {
  width: 100%;
  min-width: 0;
  background: #17202e;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 8px
}
textarea {
  resize: vertical;
  min-height: 64px;
  line-height: 1.5
}
input[type=checkbox] {
  width: 16px;
  height: 16px;
  accent-color: var(--blue)
}
input[type=color] {
  height: 35px;
  padding: 3px
}
input[type=number] {
  appearance: textfield
}
label.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  color: var(--muted);
  font-size: 12px
}
label.field>input,label.field>textarea,label.field>select {
  font-size: 13px;
  color: var(--text)
}
[hidden] {
  display: none!important
}
.toolbar {
  height: 70px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 10px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5
}
.project-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 2px 12px 2px 0;
  max-width: 440px;
  min-width: 0;
  border: 0;
  background: transparent
}
.project-heading>span:nth-child(2) {
  min-width: 0
}
.project-heading strong {
  display: block;
  font-size: 17px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis
}
.project-heading small {
  display: block;
  color: var(--muted);
  max-width: 330px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
  font-size: 11px
}
.brand-mark {
  font-size: 32px;
  color: var(--blue);
  line-height: 1
}
.toolbar-actions {
  display: flex;
  gap: 7px;
  margin-left: auto;
  flex-shrink: 0;
  justify-content: flex-end
}
#ec-viewport {
  position: absolute;
  inset: 70px 0 44px;
  overflow: hidden;
  background-color: var(--canvas);
  background-image: radial-gradient(#344055 1px,transparent 1px);
  background-size: 24px 24px;
  touch-action: none
}
#ec-world {
  position: absolute;
  transform-origin: 0 0;
  width: 0;
  height: 0
}
#ec-groups,#ec-nodes {
  position: absolute;
  inset: 0;
  width: 0;
  height: 0
}
#ec-edges {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  overflow: visible;
  pointer-events: none
}
.module-node {
  position: absolute;
  width: 360px;
  background: var(--panel);
  border: 1px solid #4b5b70;
  border-radius: 8px;
  box-shadow: 0 5px 16px #0003;
  overflow: hidden
}
.module-node.selected {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px #81b3e940,0 5px 16px #0003
}
.module-header {
  display: flex;
  gap: 9px;
  align-items: center;
  min-height: 52px;
  padding: 10px 12px;
  background: #263449;
  border-bottom: 1px solid #3c4b6070;
  cursor: grab;
  touch-action: none
}
.module-header h2 {
  font-size: 17px;
  line-height: 1.4;
  margin: 0;
  flex: 1;
  overflow-wrap: anywhere
}
.node-grip {
  color: #8194ae;
  font-size: 18px
}
.module-header button {
  border: 0;
  background: transparent;
  padding: 4px 8px
}
.module-purpose {
  font-size: 13px;
  line-height: 1.65;
  color: #c2cede;
  margin: 14px 16px 10px;
  overflow-wrap: anywhere;
  white-space: pre-wrap
}
.module-summary {
  padding: 0 16px 14px;
  color: var(--muted);
  display: grid;
  gap: 7px
}
.interface-preview {
  font-family: Consolas,"Courier New",monospace;
  font-size: 12px;
  border-left: 2px solid #6d8aaa;
  padding-left: 9px;
  overflow-wrap: anywhere
}
.module-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  border-top: 1px solid #3c4b6080;
  padding: 8px 12px;
  background: #1c2533
}
.module-footer button {
  font-size: 12px;
  padding: 4px 7px;
  background: transparent;
  border-color: transparent
}
.module-status {
  margin-right: auto;
  font-size: 11px;
  color: #b6c5d9
}
.module-status[data-status=verified] {
  color: #92c9b8
}
.module-status[data-status=modified] {
  color: #e8bb82
}
.module-details {
  padding: 14px;
  display: grid;
  gap: 15px;
  border-top: 1px solid var(--line)
}
.editor-section {
  display: grid;
  gap: 10px
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0;
  font-size: 13px;
  font-weight: 600
}
.section-heading button {
  font-size: 12px;
  padding: 4px 7px
}
.interface-editor {
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden
}
.interface-heading {
  display: flex;
  gap: 4px;
  align-items: center;
  background: #263449;
  padding: 5px
}
.interface-name {
  flex: 1;
  min-width: 0;
  text-align: left;
  white-space: normal;
  overflow-wrap: anywhere;
  font-family: Consolas,"Courier New",monospace;
  font-size: 12px;
  line-height: 1.5
}
.interface-heading>.interface-toggle {
  border: 0;
  background: transparent
}
.interface-heading>.danger-text {
  padding: 4px 7px;
  border: 0;
  background: transparent
}
.interface-body {
  padding: 10px;
  display: grid;
  gap: 12px
}
.parameter-list {
  display: grid;
  gap: 7px
}
.parameter-row,.source-row {
  padding: 9px;
  background: #192331;
  border: 1px solid #344255;
  border-radius: 4px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px
}
.parameter-row .wide,.source-row .wide {
  grid-column: 1/-1
}
.row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px
}
.row-bottom button {
  padding: 3px 7px;
  font-size: 11px
}
.check-label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px
}
.empty-note {
  color: var(--muted);
  font-size: 12px;
  margin: 0;
  line-height: 1.6
}
.evidence-editor {
  border-top: 1px solid var(--line);
  padding-top: 11px
}
.evidence-editor summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 12px
}
.evidence-content {
  display: grid;
  gap: 10px;
  margin-top: 12px
}
.group-frame {
  position: absolute;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(129,179,233,0.5);
  pointer-events: none
}
.group-header {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 14px;
  color: var(--text);
  pointer-events: auto;
  cursor: grab;
  touch-action: none
}
.group-header .group-title {
  flex: 1;
  color: #ffffff;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
.group-header button {
  background: #202a39;
  color: var(--text);
  border-color: #3c4b6080
}
.group-empty {
  position: absolute;
  left: 20px;
  top: 61px;
  font-size: 12px;
  color: var(--muted)
}
.relation-line {
  fill: none;
  stroke: #87a8ce;
  stroke-width: 2;
  pointer-events: none
}
.relation-line.dependency {
  stroke-dasharray: 7 5;
  stroke: #9db8ae
}
.relation-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 18;
  pointer-events: stroke;
  cursor: pointer
}
.relation-label {
  fill: #c6d7e9;
  paint-order: stroke;
  stroke: var(--canvas);
  stroke-width: 6px;
  stroke-linejoin: round;
  font-size: 12px;
  pointer-events: auto;
  cursor: pointer
}
.relation-group:focus-visible {
  outline: none
}
.relation-group:focus-visible .relation-line,.relation-group:hover .relation-line {
  stroke: var(--blue);
  stroke-width: 4
}
.statusbar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 44px;
  border-top: 1px solid var(--line);
  background: #1c2533;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  z-index: 5
}
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 4px
}
.zoom-controls button {
  padding: 4px 9px;
  border-color: transparent;
  background: transparent
}
.zoom-controls output {
  font-size: 12px;
  color: var(--muted);
  width: 43px;
  text-align: center
}
.canvas-hint {
  color: #8fa2ba;
  font-size: 11px
}
.save-state {
  display: flex;
  gap: 14px;
  margin-left: auto;
  min-width: 0;
  font-size: 11px
}
#ec-file-name {
  color: #8fa2ba;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
#ec-status {
  color: #c9d6e5
}
#ec-status[data-status=error] {
  color: #efaaaa
}
#ec-status[data-status=saved] {
  color: #92c9b8
}
#ec-feedback {
  position: absolute;
  right: 20px;
  top: 82px;
  z-index: 10;
  max-width: 480px;
  max-height: calc(100vh - 150px);
  overflow: auto;
  display: grid;
  gap: 8px
}
#ec-notice,#ec-warnings {
  padding: 12px 16px;
  background: #3c2d31;
  border: 1px solid #87585f;
  color: #f0c4c4;
  border-radius: 6px;
  white-space: pre-wrap;
  font-size: 12px
}
#ec-warnings {
  background: #332e22;
  border-color: #887449;
  color: #e8d4a6;
  max-height: 28vh;
  overflow: auto
}
#ec-empty {
  position: absolute;
  top: 42%;
  left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  color: var(--muted);
  font-size: 16px
}
#ec-empty button {
  display: block;
  margin: 16px auto 0
}
dialog {
  color: var(--text);
  background: var(--panel);
  border: 1px solid #52647d;
  border-radius: 10px;
  padding: 24px;
  width: min(460px,calc(100vw - 32px));
  box-shadow: 0 24px 80px #0008
}
dialog::backdrop {
  background: #090f1bb3
}
dialog form {
  display: grid;
  gap: 17px
}
dialog h2 {
  margin: 0;
  font-size: 19px
}
dialog .dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 7px
}
dialog .dialog-actions .danger-text {
  margin-right: auto
}
.dialog-error {
  margin: 0;
  color: #efaaaa;
  font-size: 12px;
  white-space: pre-wrap
}
.dialog-note {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6
}
button.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  padding: 6px;
  line-height: 1
}
.icon {
  display: block;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  pointer-events: none
}
.toolbar .icon-button,dialog .icon-button {
  width: 36px;
  height: 36px
}
#ec-empty .icon-button {
  display: flex
}
@media(max-width:1000px) {
  .canvas-hint {
    display: none
  }
  .toolbar {
    gap: 10px;
    padding: 10px
  }
  .project-heading {
    min-width: 150px;
    max-width: 270px
  }
  .project-heading small {
    max-width: 200px
  }
  .toolbar-actions {
    gap: 4px
  }
  .toolbar button {
    padding-left: 8px;
    padding-right: 8px
  }
  .save-state {
    gap: 8px
  }
}
@media(max-width:700px) {
  .toolbar {
    height: 108px;
    flex-wrap: wrap;
    gap: 8px
  }
  .project-heading {
    max-width: 100%;
    min-width: 0;
    flex: 1 1 100%
  }
  .toolbar-actions {
    width: 100%
  }
  #ec-viewport {
    top: 108px
  }
  .save-state {
    max-width: 50%
  }
  #ec-file-name {
    display: none
  }
  .statusbar {
    gap: 4px;
    padding: 0 6px
  }
  #ec-feedback {
    top: 118px;
    left: 12px;
    right: 12px
  }
  .project-heading small {
    display: none
  }
}
</style>
</head>
<body>
  <header class="toolbar">
    <div class="project-heading"><span class="brand-mark" aria-hidden="true">◇</span><span><strong id="ec-project-name">软件框架图</strong><small id="ec-project-description"></small></span></div>
    <nav class="toolbar-actions" aria-label="画布操作">
      <button type="button" data-action="edit-project" data-icon="edit" aria-label="编辑项目名称与用途" title="编辑项目名称与用途"></button>
      <button type="button" data-action="add-module" data-icon="module-add" aria-label="新建模块" title="新建模块"></button>
      <button type="button" data-action="add-group" data-icon="group-add" aria-label="新建层级" title="新建层级"></button>
      <button type="button" data-action="add-relation" data-icon="arrow-add" aria-label="新建箭头" title="新建箭头"></button>
      <button type="button" data-action="save" data-icon="save" aria-label="保存" title="保存（Ctrl / ⌘ + S）"></button>
      <button type="button" data-action="import" data-icon="import" aria-label="导入" title="导入 HTML"></button>
      <button type="button" data-action="export" data-icon="export" aria-label="导出" title="导出 HTML（Ctrl / ⌘ + Shift + S）"></button>
    </nav>
  </header>
  <main id="ec-viewport" aria-label="模块编辑画布" tabindex="0">
    <div id="ec-world"><div id="ec-groups"></div><svg id="ec-edges" aria-label="模块关系"></svg><div id="ec-nodes"></div></div>
    <div id="ec-empty" hidden>从一个模块开始<button type="button" data-action="add-module" data-icon="module-add" aria-label="新建模块" title="新建模块"></button></div>
  </main>
  <footer class="statusbar">
    <div class="zoom-controls"><button type="button" data-action="zoom-out" data-icon="zoom-out" aria-label="缩小" title="缩小"></button><output id="ec-zoom">100%</output><button type="button" data-action="zoom-in" data-icon="zoom-in" aria-label="放大" title="放大"></button><button type="button" data-action="fit" data-icon="fit" aria-label="适应视野" title="适应视野"></button></div>
    <span class="canvas-hint">拖动标题移动 · 拖动空白平移 · 滚轮缩放</span>
    <div class="save-state"><span id="ec-file-name">尚未选定文件</span><span id="ec-status" role="status" aria-live="polite"></span></div>
  </footer>
  <aside id="ec-feedback" aria-label="项目提示"><div id="ec-notice" role="alert" hidden></div><div id="ec-warnings" role="status" aria-live="polite" hidden></div></aside>
  <dialog id="ec-dialog" aria-labelledby="ec-dialog-title"></dialog>
  <template id="ec-module-template">
  <article class="module-node" tabindex="0">
    <header class="module-header"><span class="node-grip" aria-hidden="true">⠿</span><h2 class="module-name"></h2><button type="button" data-node-action="toggle" data-icon="chevron-down" aria-label="展开模块" title="展开模块"></button></header>
    <p class="module-purpose"></p>
    <div class="module-summary"></div>
    <div class="module-details" hidden></div>
    <footer class="module-footer"><span class="module-status" data-module-status></span><button type="button" data-node-action="relation" data-icon="link" aria-label="连接模块" title="连接模块"></button><button type="button" data-node-action="delete" data-icon="trash" aria-label="删除模块" title="删除模块" class="danger-text"></button></footer>
  </article>
