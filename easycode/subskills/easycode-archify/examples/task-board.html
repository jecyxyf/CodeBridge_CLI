<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>软件框架图v0.0.1</title>
  <style>:root {
  color-scheme: dark;
  --canvas: #151c28;
  --panel: #202a39;
  --line: #3c4b60;
  --text: #e8eef5;
  --muted: #a7b6c9;
  --blue: #81b3e9;
  --teal: #6da89a;
  font-family: "Segoe UI","Microsoft YaHei",sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--canvas)
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  overflow: hidden
}
button,input,textarea,select {
  font: inherit;
  color: inherit
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: #273447;
  border-radius: 5px;
  padding: 7px 11px;
  white-space: nowrap
}
button:hover {
  background: #34465e;
  border-color: #6d8aaa
}
button:disabled {
  opacity: .45;
  cursor: not-allowed
}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px
}
button.primary {
  background: #81b3e9;
  color: #142336;
  border-color: #81b3e9;
  font-weight: 600
}
button.danger-text {
  color: #efaaaa
}
input,textarea,select {
  width: 100%;
  min-width: 0;
  background: #17202e;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 8px
}
textarea {
  resize: vertical;
  min-height: 64px;
  line-height: 1.5
}
input[type=checkbox] {
  width: 16px;
  height: 16px;
  accent-color: var(--blue)
}
input[type=color] {
  height: 35px;
  padding: 3px
}
input[type=number] {
  appearance: textfield
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  color: var(--muted);
  font-size: 12px
}
.field input,.field textarea,.field select {
  font-size: 13px;
  color: var(--text)
}
[hidden] {
  display: none!important
}
.toolbar {
  height: 70px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 10px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5
}
.project-heading {
  display: flex;
  flex: 1 1 0;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 2px 12px 2px 0;
  min-width: 0;
  border: 0;
  background: transparent
}
.project-heading:hover {
  background: #263449
}
.project-heading>span:nth-child(2) {
  flex: 1;
  min-width: 0
}
.project-heading strong {
  display: block;
  font-size: 17px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis
}
.project-heading small {
  display: block;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
  font-size: 11px
}
.brand-mark {
  flex-shrink: 0;
  font-size: 32px;
  color: var(--blue);
  line-height: 1
}
.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  flex-shrink: 0;
  justify-content: flex-end
}
.toolbar-separator {
  width: 1px;
  height: 24px;
  margin: 0 7px;
  flex-shrink: 0;
  background: var(--line)
}
#ec-viewport {
  position: absolute;
  inset: 70px 0 44px;
  overflow: hidden;
  background-color: var(--canvas);
  background-image: radial-gradient(circle,#344055 var(--grid-dot-radius,1px),transparent var(--grid-dot-radius,1px));
  background-size: 10px 10px;
  background-position: -5px -5px;
  touch-action: none
}
#ec-world {
  position: absolute;
  transform-origin: 0 0;
  width: 0;
  height: 0
}
#ec-groups,#ec-nodes {
  position: absolute;
  inset: 0;
  width: 0;
  height: 0
}
#ec-edges {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  overflow: visible;
  pointer-events: none
}
.module-node {
  position: absolute;
  width: 360px;
  background: var(--panel);
  border: 1px solid #4b5b70;
  border-radius: 8px;
  box-shadow: 0 5px 16px #0003;
  overflow: visible
}
.module-port {
  position: absolute;
  z-index: 2;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  transform: translate(-50%,-50%);
  cursor: crosshair;
  touch-action: none
}
.module-port::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 2px solid #a5bfdc;
  border-radius: 50%;
  background: #202a39
}
.module-port:hover,.module-port:focus-visible {
  background: #81b3e933
}
.module-port:hover::after,.module-port:focus-visible::after,.connecting .module-port::after {
  border-color: #c4dfff;
  background: #527ba8
}
.module-port.port-source::after {
  background: #e8bb82;
  border-color: #ffe2b9;
  box-shadow: 0 0 0 4px #e8bb8240
}
.module-port.port-target::after {
  background: #82d3b9;
  border-color: #b7f5df;
  box-shadow: 0 0 0 4px #82d3b940
}
.port-top {left: 50%; top: -1px}
.port-right {left: calc(100% + 1px); top: 50%}
.port-bottom {left: 50%; top: calc(100% + 1px)}
.port-left {left: -1px; top: 50%}
.toolbar button[aria-pressed=true] {
  border-color: var(--blue);
  background: #344b65
}
.connection-hint {
  position: absolute;
  z-index: 3;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 9px 14px;
  border: 1px solid #6d8aaa;
  border-radius: 6px;
  color: #d8eaff;
  background: #203047ed;
  pointer-events: none;
  font-size: 12px;
  line-height: 1.6
}
.module-node.selected {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px #81b3e940,0 5px 16px #0003
}
.module-header {
  display: flex;
  gap: 9px;
  align-items: center;
  min-height: 52px;
  padding: 10px 12px;
  background: #263449;
  border-bottom: 1px solid #3c4b6070;
  border-radius: 7px 7px 0 0;
  cursor: grab;
  touch-action: none
}
.module-header h2 {
  font-size: 17px;
  line-height: 1.4;
  margin: 0;
  flex: 1;
  overflow-wrap: anywhere;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden
}
.node-grip {
  color: #8194ae;
  font-size: 18px
}
.module-header button {
  border: 0;
  background: transparent;
  padding: 4px 8px
}
.module-purpose {
  font-size: 13px;
  line-height: 1.65;
  color: #c2cede;
  margin: 14px 16px 10px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden
}
.module-summary {
  padding: 0 16px 14px;
  color: var(--muted);
  font-size: 12px
}
.module-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  border-top: 1px solid #3c4b6080;
  padding: 8px 12px;
  background: #1c2533;
  border-radius: 0 0 7px 7px
}
.module-status {
  margin-right: auto;
  font-size: 11px;
  color: #b6c5d9
}
.module-status[data-status=verified] {
  color: #92c9b8
}
.module-status[data-status=modified] {
  color: #e8bb82
}
.editor-section {
  display: grid;
  gap: 10px
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0;
  font-size: 13px;
  font-weight: 600
}
.section-heading button {
  font-size: 12px;
  padding: 4px 7px
}
.parameter-list {
  display: grid;
  gap: 7px
}
.parameter-row,.source-row {
  padding: 9px;
  background: #192331;
  border: 1px solid #344255;
  border-radius: 4px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px
}
.parameter-row .wide,.source-row .wide {
  grid-column: 1/-1
}
.row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px
}
.row-bottom button {
  padding: 3px 7px;
  font-size: 11px
}
.check-label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px
}
.empty-note {
  color: var(--muted);
  font-size: 12px;
  margin: 0;
  line-height: 1.6
}
.evidence-editor {
  border-top: 1px solid var(--line);
  padding-top: 11px
}
.evidence-editor summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 12px
}
.evidence-content {
  display: grid;
  gap: 10px;
  margin-top: 12px
}
.group-frame {
  position: absolute;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(129,179,233,0.5);
  pointer-events: none
}
.group-header {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 14px;
  color: var(--text);
  pointer-events: auto;
  cursor: grab;
  touch-action: none
}
.group-header .group-title {
  flex: 1;
  color: #ffffff;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
.group-header button {
  background: #202a39;
  color: var(--text);
  border-color: #3c4b6080
}
.group-empty {
  position: absolute;
  left: 20px;
  top: 61px;
  font-size: 12px;
  color: var(--muted)
}
.relation-line {
  fill: none;
  stroke: #87a8ce;
  stroke-width: 2;
  pointer-events: none
}
.relation-preview {
  fill: none;
  stroke: #e8bb82;
  stroke-width: 2;
  stroke-dasharray: 6 4;
  pointer-events: none
}
.relation-preview.has-target {
  stroke: #82d3b9
}
.relation-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 18;
  pointer-events: stroke;
  cursor: pointer
}
.relation-label {
  fill: #c6d7e9;
  paint-order: stroke;
  stroke: var(--canvas);
  stroke-width: 6px;
  stroke-linejoin: round;
  font-size: 12px;
  pointer-events: auto;
  cursor: pointer
}
.relation-group,.relation-group:focus,.relation-group:focus-visible {
  outline: none
}
.relation-group:focus-visible .relation-line,.relation-group:hover .relation-line {
  stroke: var(--blue);
  stroke-width: 3
}
.relation-group.selected .relation-line {
  stroke: #ff9f43;
  stroke-width: 3;
  marker-end: url(#ec-arrow-selected)
}
.relation-label.is-empty {opacity: 0; pointer-events: none}
.relation-actions {
  position: absolute;
  z-index: 3;
  display: flex;
  gap: 6px
}
.relation-actions[hidden] {display: none}
.relation-actions button {
  width: 32px;
  height: 32px;
  padding: 6px;
  color: var(--text);
  background: var(--panel);
  border-color: #62616a;
  box-shadow: 0 2px 6px #0004
}
.relation-actions button:hover,.relation-actions button:focus-visible {
  color: #ff9f43;
  border-color: #ff9f43;
  background: #34303a
}
.annotation-editor {
  position: absolute;
  z-index: 4;
  width: min(360px,calc(100% - 16px));
  padding: 8px;
  border: 1px solid var(--blue);
  border-radius: 6px;
  background: var(--panel);
  box-shadow: 0 5px 16px #0005
}
.annotation-editor textarea {
  display: block;
  min-height: 42px;
  resize: none
}
.annotation-editor small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px
}
.annotation-error {margin: 6px 0 0; color: #efaaaa; font-size: 12px}
.annotation-error:empty {display: none}
.statusbar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 44px;
  border-top: 1px solid var(--line);
  background: #1c2533;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  z-index: 5
}
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 4px
}
.zoom-controls button {
  padding: 4px 9px;
  border-color: transparent;
  background: transparent
}
.zoom-controls output {
  font-size: 12px;
  color: var(--muted);
  width: 43px;
  text-align: center
}
#ec-feedback {
  position: absolute;
  right: 20px;
  top: 82px;
  z-index: 10;
  max-width: 480px;
  max-height: calc(100vh - 150px);
  overflow: auto;
  display: grid;
  gap: 8px
}
#ec-notice,#ec-warnings {
  padding: 12px 16px;
  background: #3c2d31;
  border: 1px solid #87585f;
  color: #f0c4c4;
  border-radius: 6px;
  white-space: pre-wrap;
  font-size: 12px
}
#ec-warnings {
  background: #332e22;
  border-color: #887449;
  color: #e8d4a6;
  max-height: 28vh;
  overflow: auto
}
#ec-empty {
  position: absolute;
  top: 42%;
  left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  color: var(--muted);
  font-size: 16px
}
#ec-empty button {
  display: block;
  margin: 16px auto 0
}
dialog {
  color: var(--text);
  background: var(--panel);
  border: 1px solid #52647d;
  border-radius: 10px;
  padding: 24px;
  width: min(460px,calc(100vw - 32px));
  box-shadow: 0 24px 80px #0008
}
dialog::backdrop {
  background: #090f1bb3
}
dialog form {
  display: grid;
  gap: 17px
}
.dialog-body {
  display: grid;
  gap: 17px;
  min-width: 0
}
dialog.module-dialog {
  width: min(900px,calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  padding: 0;
  overflow: hidden
}
.module-dialog form {
  max-height: calc(100vh - 34px);
  grid-template-rows: auto minmax(0,1fr) auto auto;
  gap: 0
}
.module-dialog h2 {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line)
}
.module-dialog .dialog-body {
  padding: 20px 24px;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain
}
.module-editor,.member-list {
  display: grid;
  gap: 10px;
  min-width: 0
}
.editor-fold {
  min-width: 0;
  background: #1c2533;
  border: 1px solid var(--line);
  border-radius: 6px
}
.fold-heading {display: flex; align-items: center; gap: 6px; padding-right: 8px}
.fold-toggle {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border: 0;
  background: transparent;
  text-align: left;
  white-space: normal
}
.fold-icon {display: flex; flex-shrink: 0}
.fold-title {flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.5}
.fold-count {color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums}
.fold-count:empty {display: none}
.fold-body {display: grid; gap: 12px; padding: 14px; border-top: 1px solid var(--line); min-width: 0}
.member-editor {background: #192331}
.member-editor .fold-toggle {font-size: 12px}
.bilingual-fields {display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px}
.bilingual-fields input {min-width: 0}
.translation-field {min-width: 0}
.translation-control {position: relative; display: flex; min-width: 0}
.translation-control input {width: 100%; padding-right: 38px}
.translation-control .icon-button {position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; padding: 5px; border: 0; background: transparent}
.translation-control .icon-button:disabled {opacity: .45; cursor: wait}
.translation-message {font-size: 11px; line-height: 1.5; overflow-wrap: anywhere}
.translation-message:empty {display: none}
.directory-control {display: flex; gap: 6px; min-width: 0}
.directory-control input {flex: 1; min-width: 0}
.directory-control button {flex-shrink: 0}
.directory-note,.directory-status {font-size: 11px; line-height: 1.5; overflow-wrap: anywhere}
.directory-status:empty {display: none}
.module-editor .empty-note {margin: 0}
.group-add,.member-delete {flex-shrink: 0}
.group-add:hover {border-color: var(--blue)}
.module-dialog .dialog-actions {
  padding: 14px 24px;
  border-top: 1px solid var(--line)
}
.module-dialog .dialog-error:not(:empty) {
  padding: 12px 24px
}
.module-dialog .field {
  min-width: 0
}
@media(max-width:560px) {
  .module-dialog h2,.module-dialog .dialog-body,.module-dialog .dialog-actions {
    padding: 14px
  }
  .module-dialog .parameter-row,.module-dialog .source-row {
    grid-template-columns: 1fr
  }
}
dialog h2 {
  margin: 0;
  font-size: 19px
}
dialog .dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 7px
}
dialog .dialog-actions .dialog-delete {
  margin-right: auto
}
.dialog-error {
  margin: 0;
  color: #efaaaa;
  font-size: 12px;
  white-space: pre-wrap
}
.dialog-note {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6
}
button.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  padding: 6px;
  line-height: 1
}
.icon {
  display: block;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  pointer-events: none
}
.toolbar .icon-button,dialog .icon-button {
  width: 36px;
  height: 36px
}
#ec-empty .icon-button {
  display: flex
}
@media(max-width:1000px) {
  .toolbar {
    gap: 10px;
    padding: 10px
  }
  .toolbar-actions {
    gap: 4px
  }
  .toolbar-actions button {
    padding-left: 8px;
    padding-right: 8px
  }
  .toolbar-separator {
    margin: 0 4px
  }
}
@media(max-width:700px) {
  .toolbar {
    height: 108px;
    flex-wrap: wrap;
    gap: 8px
  }
  .project-heading {
    max-width: 100%;
    min-width: 0;
    flex: 1 1 100%
  }
  .toolbar-actions {
    width: 100%
  }
  #ec-viewport {
    top: 108px
  }
  .statusbar {
    gap: 4px;
    padding: 0 6px
  }
  #ec-feedback {
    top: 118px;
    left: 12px;
    right: 12px
  }
}
</style>
</head>
<body>
  <header class="toolbar">
    <button type="button" class="project-heading" data-action="edit-project" aria-label="编辑标题和描述" aria-haspopup="dialog"><span class="brand-mark" aria-hidden="true">◇</span><span><strong id="ec-project-name">软件框架图</strong><small id="ec-project-description"></small></span></button>
    <nav class="toolbar-actions" aria-label="画布操作">
      <button type="button" data-action="add-module" data-icon="module-add" aria-label="新建模块" title="新建模块"></button>
      <button type="button" data-action="add-group" data-icon="group-add" aria-label="新建层级" title="新建层级"></button>
      <span class="toolbar-separator" aria-hidden="true"></span>
      <button type="button" data-action="save" data-icon="save" aria-label="保存" title="保存（Ctrl / ⌘ + S）"></button>
      <button type="button" data-action="import" data-icon="import" aria-label="导入" title="导入 HTML"></button>
      <button type="button" data-action="export" data-icon="export" aria-label="导出" title="导出 HTML（Ctrl / ⌘ + Shift + S）"></button>
    </nav>
  </header>
  <main id="ec-viewport" aria-label="模块编辑画布" tabindex="0">
    <div id="ec-world"><div id="ec-groups"></div><svg id="ec-edges" aria-label="模块关系"></svg><div id="ec-nodes"></div></div>
    <div id="ec-connection-hint" class="connection-hint" role="status" aria-live="polite" hidden></div>
    <div id="ec-empty" hidden>从一个模块开始<button type="button" data-action="add-module" data-icon="module-add" aria-label="新建模块" title="新建模块"></button></div>
  </main>
  <footer class="statusbar">
    <div class="zoom-controls"><button type="button" data-action="zoom-out" data-icon="zoom-out" aria-label="缩小" title="缩小"></button><output id="ec-zoom">100%</output><button type="button" data-action="zoom-in" data-icon="zoom-in" aria-label="放大" title="放大"></button><button type="button" data-action="fit" data-icon="fit" aria-label="适应视野" title="适应视野"></button></div>
  </footer>
  <aside id="ec-feedback" aria-label="项目提示"><div id="ec-notice" role="alert" hidden></div><div id="ec-warnings" role="status" aria-live="polite" hidden></div></aside>
  <dialog id="ec-dialog" aria-labelledby="ec-dialog-title"></dialog>
  <template id="ec-module-template">
  <article class="module-node" tabindex="0">

  <script id="ec-bundle" type="application/json">{"canvas":"\u003c!doctype html\u003e\r\n\u003chtml lang=\"zh-CN\"\u003e\r\n\u003chead\u003e\r\n  \u003cmeta charset=\"utf-8\"\u003e\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\r\n  \u003ctitle\u003e\u003c!--EC:TITLE--\u003e\u003c/title\u003e\r\n  \u003c!--EC:STYLE--\u003e\r\n\u003c/head\u003e\r\n\u003cbody\u003e\r\n  \u003cheader class=\"toolbar\"\u003e\r\n    \u003cbutton type=\"button\" class=\"project-heading\" data-action=\"edit-project\" aria-label=\"编辑标题和描述\" aria-haspopup=\"dialog\"\u003e\u003cspan class=\"brand-mark\" aria-hidden=\"true\"\u003e◇\u003c/span\u003e\u003cspan\u003e\u003cstrong id=\"ec-project-name\"\u003e软件框架图\u003c/strong\u003e\u003csmall id=\"ec-project-description\"\u003e\u003c/small\u003e\u003c/span\u003e\u003c/button\u003e\r\n    \u003cnav class=\"toolbar-actions\" aria-label=\"画布操作\"\u003e\r\n      \u003cbutton type=\"button\" data-action=\"add-module\" data-icon=\"module-add\" aria-label=\"新建模块\" title=\"新建模块\"\u003e\u003c/button\u003e\r\n      \u003cbutton type=\"button\" data-action=\"add-group\" data-icon=\"group-add\" aria-label=\"新建层级\" title=\"新建层级\"\u003e\u003c/button\u003e\r\n      \u003cspan class=\"toolbar-separator\" aria-hidden=\"true\"\u003e\u003c/span\u003e\r\n      \u003cbutton type=\"button\" data-action=\"save\" data-icon=\"save\" aria-label=\"保存\" title=\"保存（Ctrl / ⌘ + S）\"\u003e\u003c/button\u003e\r\n      \u003cbutton type=\"button\" data-action=\"import\" data-icon=\"import\" aria-label=\"导入\" title=\"导入 HTML\"\u003e\u003c/button\u003e\r\n      \u003cbutton type=\"button\" data-action=\"export\" data-icon=\"export\" aria-label=\"导出\" title=\"导出 HTML（Ctrl / ⌘ + Shift + S）\"\u003e\u003c/button\u003e\r\n    \u003c/nav\u003e\r\n  \u003c/header\u003e\r\n  \u003cmain id=\"ec-viewport\" aria-label=\"模块编辑画布\" tabindex=\"0\"\u003e\r\n    \u003cdiv id=\"ec-world\"\u003e\u003cdiv id=\"ec-groups\"\u003e\u003c/div\u003e\u003csvg id=\"ec-edg der\u003e\r\n    \u003cp class=\"module-purpose\"\u003e\u003c/p\u003e\r\n    \u003cdiv class=\"module-summary\"\u003e\u003c/div\u003e\r\n    \u003cfooter class=\"module-footer\"\u003e\u003cspan class=\"module-status\" data-module-status\u003e\u003c/span\u003e\u003c/footer\u003e\r\n    \u003cbutton type=\"button\" class=\"module-port port-top\" data-port=\"top\" aria-label=\"上侧连接点\" title=\"上侧连接点：按住圆点拖到另一个模块的圆点\"\u003e\u003c/button\u003e\r\n    \u003cbutton type=\"button\" class=\"module-port port-right\" data-port=\"right\" aria-label=\"右侧连接点\" title=\"右侧连接点：按住圆点拖到另一个模块的圆点\"\u003e\u003c/button\u003e\r\n    \u003cbutton type=\"button\" class=\"module-port port-bottom\" data-port=\"bottom\" aria-label=\"下侧连接点\" title=\"下侧连接点：按住圆点拖到另一个模块的圆点\"\u003e\u003c/button\u003e\r\n    \u003cbutton type=\"button\" class=\"module-port port-left\" data-port=\"left\" aria-label=\"左侧连接点\" title=\"左侧连接点：按住圆点拖到另一个模块的圆点\"\u003e\u003c/button\u003e\r\n  \u003c/article\u003e\r\n\u003c/template\u003e\r\n","css":":root {\r\n  color-scheme: dark;\r\n  --canvas: #151c28;\r\n  --panel: #202a39;\r\n  --line: #3c4b60;\r\n  --text: #e8eef5;\r\n  --muted: #a7b6c9;\r\n  --blue: #81b3e9;\r\n  --teal: #6da89a;\r\n  font-family: \"Segoe UI\",\"Microsoft YaHei\",sans-serif;\r\n  font-size: 13px;\r\n  color: var(--text);\r\n  background: var(--canvas)\r\n}\r\n* {\r\n  box-sizing: border-box\r\n}\r\nbody {\r\n  margin: 0;\r\n  overflow: hidden\r\n}\r\nbutton,input,textarea,select {\r\n  font: inherit;\r\n  color: inherit\r\n}\r\nbutton {\r\n  cursor: pointer;\r\n  border: 1px solid var(--line);\r\n  background: #273447;\r\n  border-radius: 5px;\r\n  padding: 7px 11px;\r\n  white-space: nowrap\r\n}\r\nbutton:hover {\r\n  background: #34465e;\r\n  border-color: #6d8aaa\r\n}\r\nbutton:disabled {\r\n  opacity: .45;\r\n  cursor: not-allowed\r\n}\r\nbutton:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible {\r\n  outline: 2px solid var(--blue);\r\n  outline-offset: 3px\r\n}\r\nbutton.primary {\r\n  background: #81b3e9;\r\n  color: #142336;\r\n  border-color: #81b3e9;\r\n  font-weight: 600\r\n}\r\nbutton.danger-text {\r\n  color: #efaaaa\r\n}\r\ninput,textarea,select {\r\n  width: 100%;\r\n  min-width: 0;\r\n  background: #17202e;\r\n  border: 1px solid var(--line);\r\n  border-radius: 4px;\r\n  padding: 7px 8px\r\n}\r\ntextarea {\r\n  resize: vertical;\r\n  min-height: 64px;\r\n  line-height: 1.5\r\n}\r\ninput[type=checkbox] {\r\n  width: 16px;\r\n  height: 16px;\r\n  accent-color: var(--blue)\r\n}\r\ninput[type=color] {\r\n  height: 35px;\r\n  padding: 3px\r\n}\r\ninput[type=number] {\r\n  appearance: textfield\r\n}\r\n.field {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 5px;\r\n  color: var(--muted);\r\n  font-size: 12px\r\n}\r\n.field input,.field textarea,.field select {\r\n  font-size: 13px;\r\n  color: var(--text)\r\n}\r\n[hidden] {\r\n  display: none!important\r\n}\r\n.toolbar {\r\n  height: 70px;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 22px;\r\n  padding: 10px 20px;\r\n  background: var(--panel);\r\n  border-bottom: 1px solid var(--line);\r\n  position: relative;\r\n  z-index: 5\r\n}\r\n.project-heading {\r\n  display: flex;\r\n  flex: 1 1 0;\r\n  align-items: center;\r\n  gap: 12px;\r\n  text-align: left;\r\n  padding: 2px 12px 2px 0;\r\n  min-width: 0;\r\n  border: 0;\r\n  background: transparent\r\n}\r\n.project-heading:hover {\r\n  background: #263449\r\n}\r\n.project-heading\u003espan:nth-child(2) {\r\n  flex: 1;\r\n  min-width: 0\r\n}\r\n.project-heading strong {\r\n  display: block;\r\n  font-size: 17px;\r\n  overflow: hidden;\r\n  white-space: nowrap;\r\n  text-overflow: ellipsis\r\n}\r\n.project-heading small {\r\n  display: block;\r\n  color: var(--muted);\r\n  white-space: nowrap;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  margin-top: 3px;\r\n  font-size: 11px\r\n}\r\n.brand-mark {\r\n  flex-shrink: 0;\r\n  font-size: 32px;\r\n  color: var(--blue);\r\n  line         dialogs = EC.Dialogs.create({project,onChange,onOpen:() => {canvas?.cancelConnection(); return canvas?.finishAnnotation();}});
        nodes = EC.Nodes.create({project,layer:get('ec-nodes'),template:get('ec-module-template'),onEdit:dialogs.editModule});
        nodes.render();
        canvas = EC.Canvas.create({project,viewport:get('ec-viewport'),world:get('ec-world'),groupLayer:get('ec-groups'),edgeLayer:get('ec-edges'),nodes,onChange,onGroupEdit:dialogs.editGroup});
        refreshHeader();
        EC.app = {project,storage,nodes,canvas,dialogs};
      }
      mount();
      // Preserve a saved view. New projects with the default view start with all modules visible.
      if (project.view.x === 0 && project.view.y === 0 && project.view.scale === 1 && project.modules.length) canvas.fit({notify:false});
      function save(asNew) {
        if (dialogs.isEditingModule() || dialogs.isEditingProject()) {dialogs.showMessage('请先点击“确定”或“取消”，再保存 HTML。'); return;}
        if (!canvas.finishAnnotation()) return;
        if (!supported) {showError('此浏览器不能直接写入本地文件。请使用新版桌面 Chrome 或 Edge 打开此 HTML。'); return;}
        notice.hidden = true;
        // Do not await anything before calling Storage: native pickers require this click stack.
        try {
          const operation = asNew ? storage.saveAs() : storage.save();
          operation.catch(error => {if (error?.name !== 'AbortError') showError(error);});
        } catch (error) {if (error?.name !== 'AbortError') showError(error);}
      }
      function importFile() {
        if (dialogs.isEditingModule() || dialogs.isEditingProject()) {dialogs.showMessage('请先点击“确定”或“取消”，再导入 HTML。'); return;}
        if (!canvas.finishAnnotation()) return;
        if (typeof root.showOpenFilePicker !== 'function') {showError('此浏览器不能导入本地文件。请使用新版桌面 Chrome 或 Edge。'); return;}
        notice.hidden = true;
        storage.importFile().catch(error => {if (error?.name !== 'AbortError') showError(error);});
      }
      const actions = {
        'add-module'() {
          const center = canvas.centerPoint(), position = EC.Canvas.snapPoint({x:center.x - 180,y:center.y - 100});
          dialogs.editModule(undefined,position);
        },
        'add-group':() => dialogs.editGroup(),
        'edit-project':() => dialogs.editProject(), 'zoom-in':() => canvas.zoomBy(1.2), 'zoom-out':() => canvas.zoomBy(1 / 1.2),
        fit:() => canvas.fit(), save:() => save(false), import:importFile, export:() => save(true)
      };
      for (const control of document.querySelectorAll('[data-action]')) control.addEventListener('click',() => {
        try {
          if (!['zoom-in','zoom-out','fit'].includes(control.dataset.action)) canvas.cancelConnection();
          actions[control.dataset.action]?.();
        } catch (error) {showError(error);}
      });
      root.addEventListener('keydown',event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {event.preventDefault(); save(event.shiftKey);}
      });
      root.addEventListener('beforeunload',event => {if (storage.isDirty() || dialogs.hasDraftChanges() || canvas.hasDraftChanges()) {event.preventDefault(); event.returnValue = '';}});
      if (!supported) showError('此浏览器不能直接写入本地文件。请使用新版桌面 Chrome 或 Edge 打开此 HTML。');
    } catch (error) {
      showError(error);
      for (const control of document.querySelectorAll('[data-action]')) control.disabled = true;
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
})(globalThis);
</script>
</body>
</html>
