<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title><!--EC:TITLE--></title>
  <!--EC:STYLE-->
</head>
<body>
  <header class="toolbar">
    <div class="project-heading"><span class="brand-mark" aria-hidden="true">◇</span><span><strong id="ec-project-name">模块画布</strong><small id="ec-project-description"></small></span><button type="button" data-action="edit-project" data-icon="edit" aria-label="编辑项目名称与用途" title="编辑项目名称与用途"></button></div>
    <nav aria-label="画布操作"><button type="button" data-action="add-module" data-icon="module-add" aria-label="添加模块" title="添加模块"></button><button type="button" data-action="add-group" data-icon="group-add" aria-label="创建分组" title="创建分组"></button><button type="button" data-action="add-relation" data-icon="link" aria-label="连接模块" title="连接模块"></button></nav>
    <div class="save-actions"><button type="button" class="primary" data-action="save" data-icon="save" aria-label="保存" title="保存（Ctrl / ⌘ + S）"></button><button type="button" data-action="save-as" data-icon="save-as" aria-label="另存为" title="另存为（Ctrl / ⌘ + Shift + S）"></button></div>
  </header>
  <main id="ec-viewport" aria-label="模块编辑画布" tabindex="0">
    <div id="ec-world"><div id="ec-groups"></div><svg id="ec-edges" aria-label="模块关系"></svg><div id="ec-nodes"></div></div>
    <div id="ec-empty" hidden>从一个模块开始<button type="button" data-action="add-module" data-icon="module-add" aria-label="添加模块" title="添加模块"></button></div>
  </main>
  <footer class="statusbar">
    <div class="zoom-controls"><button type="button" data-action="zoom-out" data-icon="zoom-out" aria-label="缩小" title="缩小"></button><output id="ec-zoom">100%</output><button type="button" data-action="zoom-in" data-icon="zoom-in" aria-label="放大" title="放大"></button><button type="button" data-action="fit" data-icon="fit" aria-label="适应视野" title="适应视野"></button></div>
    <span class="canvas-hint">拖动标题移动 · 拖动空白平移 · 滚轮缩放</span>
    <div class="save-state"><span id="ec-file-name">尚未选定文件</span><span id="ec-status" role="status" aria-live="polite"></span></div>
  </footer>
  <aside id="ec-feedback" aria-label="项目提示"><div id="ec-notice" role="alert" hidden></div><div id="ec-warnings" role="status" aria-live="polite" hidden></div></aside>
  <dialog id="ec-dialog" aria-labelledby="ec-dialog-title"></dialog>
  <!--EC:NODE-->
  <!--EC:DATA-->
  <!--EC:BUNDLE-->
  <!--EC:RUNTIME-->
</body>
</html>
