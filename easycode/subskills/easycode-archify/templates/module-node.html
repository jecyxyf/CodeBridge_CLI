<template id="ec-module-template">
  <article class="module-node" tabindex="0">
    <header class="module-header"><span class="node-grip" aria-hidden="true">⠿</span><h2 class="module-name"></h2><button type="button" data-node-action="toggle" aria-label="展开模块">⌄</button></header>
    <p class="module-purpose"></p>
    <div class="module-summary"></div>
    <div class="module-details" hidden></div>
    <footer class="module-footer"><span class="module-status"></span><button type="button" data-node-action="relation">连接</button><button type="button" data-node-action="delete" class="danger-text">删除</button></footer>
  </article>
</template>
