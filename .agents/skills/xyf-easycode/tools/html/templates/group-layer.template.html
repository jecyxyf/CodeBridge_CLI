<!--
  分层完整模板：指导书。最小运行骨架为同目录的 group-layer.html。
  canvas.js 按 project.groups 复制结构；模块通过 groupId 引用所属层级。
  实际字段和示例见 archifytemplate.jsonc 的 groups 部分。

  全部数据参数：
  id：必填字符串，全项目唯一；模块的 groupId 使用该值。改名称时不换 ID。
  name：层级中文名，显示在标题栏。
  englishName：层级英文名，保存在数据和配置中。
  color：必填字符串，标题文字及三个点按钮的前景颜色，建议使用六位十六进制颜色。
  backgroundColor：可选字符串，六位十六进制颜色；未填时使用浅蓝色默认值。
  x、y：必填有限数值，空层级的画布坐标；有成员时按成员边界计算包围框。

  计算出的显示属性，不要添加为 JSON 参数：
  背景透明度固定为 50%；空层级尺寸为 400 × 170。
  有成员时包围框在左右及底部留 20、顶部留 56 画布像素，边界向外对齐网格。
  宽、高由 canvas.js 计算；拖动标题会一起移动所属模块。
  标题按钮背景透明，露出分层背景；前景使用层级的 color。
  删除层级会保留模块，并把这些模块的 groupId 设为空字符串。

  模板接入：
  scripts/build.mjs 读取运行骨架到 bundle.group。
  Serialization.buildDocument 通过 canvas.html 的 EC:GROUP 槽位内嵌此结构。
  app.js 将 ec-group-template 交给 Canvas.create 的 groupTemplate 参数。
  网页入口与导出的 HTML 快照通过 ec-bundle 保留分层运行骨架，打开时无需外部模板文件；本地模式保存的是 JSON。
-->
<!-- ec-group-template：分层模板 ID，与 app.js 中的引用保持一致。 -->
<template id="ec-group-template">
  <!-- group-frame：分层根节点；data-group-id、位置、尺寸和颜色由 canvas.js 填充。 -->
  <section class="group-frame">
    <!-- group-header：可拖动的标题区域；其 data-group-id 由脚本填充。 -->
    <header class="group-header">
      <!-- group-title：层级 name，使用 textContent 写入，名称不会被当成 HTML。 -->
      <span class="group-title"></span>
      <!-- edit：编辑当前层级；more：三个点图标；aria-label 和 title 分别用于读屏及停留提示。 -->
      <button type="button" data-group-action="edit" data-icon="more" aria-label="编辑分组" title="编辑分组"></button>
    </header>
    <!-- group-empty：层级没有成员时显示的操作说明；有成员时由脚本隐藏。 -->
    <span class="group-empty">编辑模块，在“所属层级”中加入此层级</span>
  </section>
</template>
