<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>架构模板稳定性测试</title>
  <style>
    :root{color-scheme:light;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#21334d;background:#f2f5f9;font-size:14px}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}a{color:#2159ac;text-decoration:none}a:hover{text-decoration:underline}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 30px;background:white;border-bottom:1px solid #dce4ee}.title{margin:0;font-size:23px;font-weight:650;letter-spacing:-.7px}.subtitle{margin:8px 0 0;color:#63768e;font-size:13px}.controls{display:flex;gap:9px;flex-wrap:wrap}button{border:1px solid #cfdbe9;border-radius:7px;padding:9px 14px;background:white;color:#274264}.primary{background:#2159ac;border-color:#2159ac;color:white}
    .layout{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:calc(100vh - 103px)}.sidebar{background:#fff;border-right:1px solid #dce4ee;padding:20px 13px 20px 18px}.sidebar input,.sidebar select{width:100%;padding:9px;border:1px solid #d5dfeb;border-radius:6px;margin-bottom:10px;color:#274264;background:white}.case-list{max-height:calc(100vh - 245px);overflow:auto}.case-button{width:100%;text-align:left;display:block;border:0;border-radius:5px;padding:10px;margin:2px 0;background:transparent}.case-button small{display:block;margin-top:4px;color:#73849b;font-size:11px}.case-button.active{background:#eaf1fb;color:#174f9b}.case-button[data-result=passed]{border-left:3px solid #26836a}.case-button[data-result=failed]{border-left:3px solid #b83c4d}.case-button:hover{background:#f1f5fa}
    main{min-width:0;padding:20px 26px 32px}.summary{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px}.summary strong{font-size:16px}.summary output{color:#63768e;font-size:12px}progress{width:100%;height:6px;display:block;accent-color:#2159ac;margin-bottom:18px}.preview-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.preview-heading h2{margin:0;font-size:16px;font-weight:600}.preview-heading nav{display:flex;gap:16px;font-size:12px}.viewer{height:560px;border:1px solid #d5dfeb;border-radius:9px;overflow:hidden;background:white}.viewer iframe{width:100%;height:100%;display:block;border:0}.busy .viewer iframe{pointer-events:none}.note{color:#63768e;font-size:12px;line-height:1.7;margin:12px 0 22px}.note code{color:#385371}.results{background:white;border:1px solid #d5dfeb;border-radius:9px;overflow:hidden}.results header{padding:17px 19px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:12px;align-items:center}.results h2{font-size:16px;margin:0}.results header span{font-size:12px;color:#63768e}.table-wrap{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th,td{text-align:left;padding:11px 16px;border-bottom:1px solid #ecf0f5}th{font-weight:600;color:#63768e;background:#fbfcfe;position:sticky;top:0}td:last-child{max-width:360px;overflow:hidden;text-overflow:ellipsis}.pass{color:#167258}.fail{color:#b13244}.empty{text-align:center;padding:30px;color:#7b8aa0}.status-error{color:#b13244!important}
    @media(max-width:900px){.top{align-items:flex-start;padding:20px;flex-direction:column}.layout{grid-template-columns:200px minmax(0,1fr)}main{padding:18px 14px}.viewer{height:520px}.preview-heading{align-items:flex-start;flex-direction:column}.summary{align-items:flex-start;flex-direction:column;gap:7px}}@media(max-width:620px){.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid #dce4ee}.case-list{max-height:160px}.viewer{height:480px}}
  </style>
</head>
<body>
  <header class="top">
    <div><h1 class="title">架构模板稳定性测试</h1><p class="subtitle">100 份固定数据，从空项目到 1000 个模块，逐份检查显示与保存。</p></div>
    <div class="controls"><button id="run-current">测试当前</button><button id="run-all" class="primary">测试全部 100 份</button><button id="stop" disabled>停止</button></div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="测试数据选择">
      <input id="search" type="search" placeholder="搜索编号或场景" aria-label="搜索测试数据">
      <select id="category" aria-label="按场景筛选"><option value="">全部场景</option></select>
      <div id="case-list" class="case-list"></div>
    </aside>
    <main>
      <section class="summary" aria-live="polite"><strong id="status">正在读取测试数据…</strong><output id="metrics">尚未测试</output></section>
      <progress id="progress" max="100" value="0" aria-label="测试进度"></progress>
      <section class="preview-heading"><h2 id="case-title">测试预览</h2><nav><a id="json-link" target="_blank" rel="noopener">查看 JSON</a><a id="page-link" target="_blank" rel="noopener">单独打开网页</a></nav></section>
      <div id="viewer" class="viewer"></div>
      <p class="note">切换数据会重置预览中的修改。全部测试会逐份加载数据、检查详情和层级编辑，再验证保存内容并重新加载。保存测试使用内存文件，浏览器原生文件选择窗口另行手测。</p>
      <section class="results"><header><h2>测试结果</h2><span id="report-time">结果会保存在本目录的 report.json</span></header><div class="table-wrap"><table><thead><tr><th>数据</th><th>模块</th><th>连线</th><th>加载</th><th>保存</th><th>重载</th><th>结果</th></tr></thead><tbody id="results"><tr><td colspan="7" class="empty">选择一份数据预览，或点击“测试全部 100 份”。</td></tr></tbody></table></div></section>
    </main>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
