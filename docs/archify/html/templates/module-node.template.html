<!--
  模块完整模板：指导书。最小运行骨架为同目录的 module-node.html。
  节点结构由 nodes.js 复制，实际内容来自 project.modules，不在 HTML 中硬编码业务数据。
  每个模块及其成员的完整 JSON 写法见 archifytemplate.jsonc。

  模块数据：
  id：全项目唯一标识，改名时保持不变；节点的 data-module-id 由脚本填入。
  name：中文名，显示在大标题；englishName：英文标识，配置和数据中保留。
  purpose：模块功能说明；language：编程语言，空值时不显示语言文字。
  codeLocation：相对代码目录的路径，多处位置用换行分隔。
  groupId：所属层级 ID，空字符串表示无；用于分层包围和整体拖动，不显示在节点正文。
  x、y：模块在画布中的坐标，单位为画布像素。
  appearance.textColor：字体颜色；backgroundColor：节点背景；headerColor：标题栏背景。
  status：planned / verified / modified，表示内容与源码的核对状态。
  sources：源码出处，包含 path、line、endLine、symbol；不能把示例当作真实依据。
  unknowns：模型保留的未核实内容列表；没有内容时保留空数组，不添加待确认方案。
  requirements：功能需求字符串列表，每条对应一行。
  parameters：模块参数，含 id、name、englishName、type、description、defaultValue、required。
  structures：数据结构，含 id、name、englishName、fields；字段含 id、name、englishName、type、description。
  interfaces：方法，含名称、用途、流程、错误处理、来源状态、输入输出及核对标记。
  events：消息事件，含名称、用途、方向、参数；trigger 是内部保留字段，界面不提供填写项。
  tests：测试项，含 id、name、englishName、steps、expected。
  方法、事件和参数的详细填写规则以 archifytemplate.jsonc 的逐字段说明为准。

  运行显示：
  模块信息、功能需求、参数、方法、消息事件由 nodes.js 按内容生成；没有内容的分组跳过。
  参数、方法、事件列表以中文名和用途为主；点击条目后显示详情，不在画布中直接修改。
  structures、tests、来源状态等保存在数据及编辑界面中，不自动新增画布分组。
  字体、背景、标题栏的具体样式在 assets/editor.css；模板保留必要的 class 和标记。
-->
<!-- ec-module-template：app.js 获取的模块结构模板，template 本身不直接显示。 -->
<template id="ec-module-template">
  <!-- module-node：可选中的模块根节点；tabindex=0 允许键盘聚焦；位置和选中边框由脚本控制。 -->
  <article class="module-node" tabindex="0">
    <div class="module-shell">
      <!-- module-header：标题栏，也是拖动模块的区域。 -->
      <header class="module-header">
        <!-- node-emblem：由 Icons.create 填充的模块图标；aria-hidden 避免读屏重复播报。 -->
        <span class="node-emblem" aria-hidden="true"></span>
        <!-- module-name 对应 name；module-language 对应 language，初始隐藏。 -->
        <div class="module-heading"><h2 class="module-name"></h2><span class="module-language" hidden></span></div>
        <div class="module-header-actions">
          <!-- edit：打开当前模块设置；more：三个点图标；按钮背景与节点一致，前景遵循字体颜色。 -->
          <button type="button" class="module-more" data-node-action="edit" data-icon="more" aria-label="编辑模块" title="编辑模块"></button>
        </div>
      </header>
      <!-- module-content：动态生成的各分组容器；骨架内保持为空。 -->
      <div class="module-content"></div>
    </div>
    <!--
      module-port：连线连接点，port-top/right/bottom/left 控制位置。
      data-port：对应 relations 的 fromPort / toPort，只能是 top、right、bottom、left。
      type=button：独立操作按钮；aria-label：读屏名称；title：操作说明。
      拖动由 canvas.js 处理；四个连接点及其标记都需保留。
    -->
    <button type="button" class="module-port port-top" data-port="top" aria-label="上侧连接点" title="上侧连接点：按住圆点拖到另一个模块的圆点"></button>
    <button type="button" class="module-port port-right" data-port="right" aria-label="右侧连接点" title="右侧连接点：按住圆点拖到另一个模块的圆点"></button>
    <button type="button" class="module-port port-bottom" data-port="bottom" aria-label="下侧连接点" title="下侧连接点：按住圆点拖到另一个模块的圆点"></button>
    <button type="button" class="module-port port-left" data-port="left" aria-label="左侧连接点" title="左侧连接点：按住圆点拖到另一个模块的圆点"></button>
  </article>
</template>
